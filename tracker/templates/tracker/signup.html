<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: #fff;
            width: 340px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #e6e9ef;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #222;
        }

        form p {
            margin-bottom: 14px;
        }

        label {
            font-size: 13px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #d6dbe6;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
            background: #fafbff;
        }

        input:focus {
            border-color: #4a90e2;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74,144,226,0.15);
        }

        button {
            width: 100%;
            padding: 11px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        button:hover {
            background: #357ab8;
        }

        .errorlist {
            color: #d93025;
            font-size: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .login-link {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #555;
}

.login-link a {
    color: #4a90e2;
    text-decoration: none;
    font-weight: bold;
}

.login-link a:hover {
    text-decoration: underline;
}
    </style>

</head>
<body>

    <div class="box">
        <h1>Create Account</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Log In</a>
        </p>

    </div>

</body>
</html>
