<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: #fff;
            width: 340px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #e6e9ef;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d6dbe6;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #357ab8;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
